<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Age Verification</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
            color: white;
        }

        .container {
            text-align: center;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .yes {
            background: green;
            color: white;
        }

        .no {
            background: red;
            color: white;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}
    </style>
</head>

<body>

    <div class="container" id="main">
        <h1>Are you 18 or above?</h1>
        <button class="yes" onclick="rickroll()">Yes (18+)</button>
        <button class="no" onclick="rickroll()">No (Under 18)</button>
    </div>

    <script>
function rickroll() {
    document.getElementById("main").innerHTML = `
        <div style="
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:black;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            flex-direction:column;
        ">
            <p>Verifying your age...</p>
            <p style="font-size:18px; opacity:0.7;">Please wait</p>
        </div>
    `;

    setTimeout(() => {
        document.body.innerHTML = `
            <video autoplay loop id="vid"
    style="position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;"
    onclick="this.play()"
    oncontextmenu="return false;">
    <source src="rickroll.mp4" type="video/mp4">
</video>
        `;

        const video = document.getElementById("vid");
        video.play();

        if (video.requestFullscreen) {
            video.requestFullscreen();
        }

    }, 1500); 
}
document.addEventListener("keydown", function(e) {
    e.preventDefault();
});
</script>

</body>

</html>
